workflows:
  ios_test:
    name: Expensify iOS Test

    instance_type: mac_mini_m2

    max_build_duration: 30

    environment:
      xcode: latest
      node: 20.20.2
      npm: 10.8.2
      cocoapods: default

    scripts:

      - name: Fix submodule URL
        script: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Check versions
        script: |
          node -v
          npm -v
          xcodebuild -version

      - name: Install dependencies
        script: |
          npm install

      - name: Install iOS pods
        script: |
          cd ios
          pod install

      - name: List iOS schemes
        script: |
          cd ios
          xcodebuild \
          -workspace NewExpensify.xcworkspace \
          -list

      - name: Build iOS Simulator app
        script: |
          cd ios

          xcodebuild \
          -workspace NewExpensify.xcworkspace \
          -scheme Expensify.dev \
          -configuration Debug \
          -sdk iphonesimulator \
          -derivedDataPath ../build \
          build

    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app
