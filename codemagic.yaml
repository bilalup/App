workflows:
  ios_test:
    name: Expensify iOS Test

    instance_type: mac_mini_m2

    max_build_duration: 30

    environment:
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install pods
        script: |
          cd ios
          pod install

      - name: Build simulator app
        script: |
          xcodebuild \
          -workspace ios/*.xcworkspace \
          -scheme Expensify \
          -configuration Debug \
          -sdk iphonesimulator \
          build

    artifacts:
      - build/**/*.app
