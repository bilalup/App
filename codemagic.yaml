workflows:
  ios_test:
    name: Expensify iOS Test

    instance_type: mac_mini_m2

    max_build_duration: 30

    environment:
      xcode: latest

      node: 20.20.2
      npm: 10.8.2
      bun: 1.3.14

      cocoapods: default

    scripts:
      - name: Check versions
        script: |
          node -v
          npm -v
          bun -v
          xcodebuild -version

      - name: Install dependencies
        script: |
          npm install

      - name: Install iOS pods
        script: |
          cd ios
          pod install

      - name: List available schemes
        script: |
          xcodebuild \
          -workspace ios/NewExpensify.xcworkspace \
          -list

      - name: Build iOS Simulator app
        script: |
          xcodebuild \
          -workspace ios/NewExpensify.xcworkspace \
          -scheme NewExpensify \
          -configuration Debug \
          -sdk iphonesimulator \
          -derivedDataPath build \
          build

    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app
